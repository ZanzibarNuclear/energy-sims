[workspace]
members = [
    "crates/energy-sim-core",
    "crates/energy-sim-runtime",
    "crates/energy-sim-cli",
    "crates/energy-sim-server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/ZanzibarNuclear/energy-sims"
rust-version = "1.76"
authors = ["Zanzibar Nuclear"]

[workspace.dependencies]
energy-sim-core = { path = "crates/energy-sim-core" }
energy-sim-runtime = { path = "crates/energy-sim-runtime" }

# Shared third-party deps (versions pinned at workspace root)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
axum = { version = "0.8", features = ["ws", "macros"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
